<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"></meta>
    <title>AI Ses Asistanı</title>
    <style>
        body{
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            margin: 0;
        }
        h1{color: #00d2ff; }
        .container{
            background-color: #2a2a40;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        textarea{
            width: 90%;
            height: 150px;
            background-color:#fff;
            border: 2px solid #3a3a5a;
            border-radius: 10px;
            padding: 15px;
            font-size: 16px;
            resize: none;
            margin-bottom: 20px;
            outline: none;
        }
        textarea:focus{ border-color: #00d2ff;}
        .btn-group{display: flex; justify-content: center; gap: 15px; }
        button{
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-mic{ background-color: #ff4757; color: white; }
        .btn-mic:hover{ background-color: #ff6b81;}
        .btn-analyze{background-color: #1dd1a1; color: white;}
        .btn-analyze:hover{background-color: #10ac84;}
        .btn-mic.listening{animation: pulse 1.5s infinite; background-color: #e84118;}

        @keyframes pulse{
            0% {transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7);}
            70%{transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 71, 87, 0);}
            100%{tranform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0);}
        }

        #result{
            margin-top: 25px;
            background-color: #1e1e2f;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            display: none;
            border-left: 5px solid #1dd1a1;
        }
        .loader{
            display: none;
            margin-top: 20px;
            font-style: italic;
            color: #00d2ff;
        }
    </style>
</head>
<body>
    <h1>🎙️ AI Ses ve Duygu Asistanı</h1>

    <div class="container">
        <textarea id="transcriptText" placeholder="Sizi dinliyorum..."></textarea>

        <div class="btn-group">
            <button id="micBtn" class="btn-mic" onclick="toggleListening()">🎤 Dinlemeyi Başlat</button>
            <button id="analyzeBtn" class="btn-analyze" onclick="analizGonder()">🧠 Analiz Et</button>
        </div>

        <div id="loading" class="loader">Yapay zeka analiz ediyor, lütfen bekleyin...🚀</div>

        <div id="result">
            <h3 style="margin-top:0; color: #1dd1a1;">Analiz Sonucu:</h3>
            <p id="resultText"></p>
        </div>
    </div>
    
    <script>
        // Tarayıcının konuşma özelliğini başlatma (sadece Chorome/Edge gibi tarayıcılarda çalışır)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;
        let kaliciMetin = "";

        const textArea = document.getElementById('transcriptText');
        const micBtn = document.getElementById('micBtn');

        if(SpeechRecognition){
            recognition = new SpeechRecognition();
            recognition.continuous = true; // konuşmacı susana kadar durmaz
            recognition.interimResults = true; // Anlık sonuçları gösterir
            recognition.lang = 'tr-TR';

            recognition.onresult = function(event){
                let geciciMetin = '';

                for(let i = event.resultIndex; i < event.results.length; i++){
                    if(event.results[i].isFinal){
                        kalicimetin += event.results[i][0].transcript + ' ';
                    }else{
                        geciciMetin += event.results[i][0].transcript;
                    }
                }

                // hem kesinleşenleri hem de anlık konuşmaları aynı anda ekrana basma
                textArea.value = kaliciMetin + geciciMetin;
            };
        }else{
            alert("Tarayıcınız anlık ses tanımayı desteklemiyor. Lütfen Google Chorome kullanın.");
        }

        function toggleListening(){
            if(!recognition) return;

            if(isListening){
                stopListening();
            }else{
                textArea.value = ''; // Yeniden başlatınca eski metni temizle
                kaliciMetin = "";
                recognition.start();
                isListening = true;
                micBtn.textContent = "⏹️ Dinlemeyi Durdur";
                micBtn.classList.add("listening");
            }
        }

        function stopListening(){
            if(recognition){
                recognition.stop();
                isListening = false;
                micBtn.textContent = "🎤 Dinlemeyi Başlat";
                micBtn.classList.remove("listening");
            }
        }

        async function analizGonder(){
            const metin = textArea.value.trim();
            if (metin === ""){
                alert("Analiz edilecek metin yok!");
                return;
            }

            if(isListening) stopListening();
            
            const loading = document.getElementById('loading');
            const resultBox = document.getElementById('result');
            const resultText = document.getElementById('resultText');

            loading.style.display = "block";
            resultBox.style.display = "none";

            try{
                //FastPI'deki /duygu-analizi enpoint'ine istek atıyoruz
                const response = await fetch("http://127.0.0.1:8000/duygu-analizi",{
                    method: "POST",
                    headers:{
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({metin: metin})
                });

                const data = await response.json();

                if(response.ok){
                    // API den gelen JSON formatındaki metni ekrana güzelce bas
                    resultText.innerHTML = data.sonuc.replace(/\n/g, '<br>');
                    resultBox.style.display = "block";
                }else{
                    alert("Sunucu bir hata döndürdü: " + data.detail);
                }
            }catch(error){
                console.error("Hata:", error);
                alert("API'ye bağlanılamadı. Sunucunun çalıştığına emin olun.");
            }finally{
                loading.style.display = "none";
            }
        }
    </script>
</body>
</html>
